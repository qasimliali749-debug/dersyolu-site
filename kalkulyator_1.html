<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Mini Kalkulyator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .calc {
    background: #111827;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    width: 300px;
  }
  #ekran {
    width: 100%;
    height: 70px;
    background: #1f2937;
    color: #fff;
    font-size: 28px;
    text-align: right;
    border: none;
    border-radius: 12px;
    padding: 10px 15px;
    margin-bottom: 15px;
    box-sizing: border-box;
    overflow-x: auto;
  }
  .duymeler {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  button {
    padding: 18px 0;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #374151;
    color: #fff;
    transition: 0.15s;
  }
  button:hover { background: #4b5563; }
  .amel { background: #f59e0b; color: #111; font-weight: bold; }
  .amel:hover { background: #fbbf24; }
  .beraber { background: #10b981; color: #fff; grid-column: span 2; }
  .beraber:hover { background: #34d399; }
  .temizle { background: #ef4444; }
  .temizle:hover { background: #f87171; }
</style>
</head>
<body>

<div class="calc">
  <input type="text" id="ekran" readonly value="0">
  <div class="duymeler">
    <button class="temizle" onclick="temizle()">C</button>
    <button class="amel" onclick="yaz('(')">(</button>
    <button class="amel" onclick="yaz(')')">)</button>
    <button class="amel" onclick="yaz('/')">÷</button>

    <button onclick="yaz('7')">7</button>
    <button onclick="yaz('8')">8</button>
    <button onclick="yaz('9')">9</button>
    <button class="amel" onclick="yaz('*')">×</button>

    <button onclick="yaz('4')">4</button>
    <button onclick="yaz('5')">5</button>
    <button onclick="yaz('6')">6</button>
    <button class="amel" onclick="yaz('-')">−</button>

    <button onclick="yaz('1')">1</button>
    <button onclick="yaz('2')">2</button>
    <button onclick="yaz('3')">3</button>
    <button class="amel" onclick="yaz('+')">+</button>

    <button onclick="yaz('0')">0</button>
    <button onclick="yaz('.')">.</button>
    <button class="amel" onclick="yaz('^')">x^y</button>
    <button class="amel" onclick="kvadrat()">x²</button>

    <button class="amel" onclick="koklu()">√x</button>
    <button class="amel" onclick="yaz('%')">%</button>
    <button class="beraber" onclick="hesabla()">=</button>
  </div>
</div>

<script>
  const ekran = document.getElementById('ekran');
  let ifade = '';

  function yaz(sim) {
    if (ifade === '0') ifade = '';
    ifade += sim;
    ekran.value = ifade;
  }

  function temizle() {
    ifade = '';
    ekran.value = '0';
  }

  function kvadrat() {
    if (ifade === '' || ifade === '0') return;
    ifade += '^2';
    ekran.value = ifade;
  }

  function koklu() {
    if (ifade === '') ifade = ekran.value;
    ifade = 'sqrt(' + ifade + ')';
    ekran.value = ifade;
  }

  function hesabla() {
    try {
      if (/^[0-9+\-*/().^%\s]*$|^sqrt\([0-9+\-*/().^%\s]*\)$/.test(ifade)) {
        let hazirIfade = ifade
          .replace(/\^/g, '**')
          .replace(/sqrt\(([^)]*)\)/g, 'Math.sqrt($1)')
          .replace(/(\d+(\.\d+)?)%/g, '($1/100)');

        let netice = Function('"use strict"; return (' + hazirIfade + ')')();
        ekran.value = netice;
        ifade = netice.toString();
      } else {
        ekran.value = 'Xəta';
        ifade = '';
      }
    } catch (e) {
      ekran.value = 'Xəta';
      ifade = '';
    }
  }

  document.addEventListener('keydown', function(e) {
    if (/[0-9+\-*/().]/.test(e.key)) {
      yaz(e.key);
    } else if (e.key === 'Enter') {
      hesabla();
    } else if (e.key === 'Backspace') {
      ifade = ifade.slice(0, -1);
      ekran.value = ifade || '0';
    } else if (e.key === 'Escape') {
      temizle();
    }
  });
</script>

</body>
</html>
